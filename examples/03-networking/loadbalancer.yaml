# Needs a load balancer provider (cloud controller, MetalLB, ...).
# Without one, EXTERNAL-IP stays <pending>; the Service still gets a NodePort and ClusterIP.
apiVersion: v1
kind: Service
metadata:
  name: demo-deploy-lb
spec:
  type: LoadBalancer
  selector:
    app: demo-deploy
  ports:
    - port: 80
      targetPort: http
