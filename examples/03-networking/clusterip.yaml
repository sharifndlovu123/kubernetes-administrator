# Backend Deployment plus a ClusterIP Service in front of it.
# Imperative equivalent: kubectl create deployment demo-deploy --image=nginx --replicas=3 --port=80
#                        kubectl expose deployment demo-deploy --port=80 --target-port=80
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-deploy
spec:
  replicas: 3
  selector:
    matchLabels:
      app: demo-deploy
  template:
    metadata:
      labels:
        app: demo-deploy
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - name: http          # named so the Service can use targetPort: http
              containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: demo-deploy
spec:
  type: ClusterIP                 # default; reachable only inside the cluster
  selector:
    app: demo-deploy              # must match the Pod template labels
  ports:
    - name: http
      protocol: TCP
      port: 80                    # port on the Service's virtual IP
      targetPort: http            # port on the Pod (name or number)
---
# Headless variant: no virtual IP, DNS returns the Pod IPs directly.
apiVersion: v1
kind: Service
metadata:
  name: demo-deploy-headless
spec:
  clusterIP: None
  selector:
    app: demo-deploy
  ports:
    - port: 80
      targetPort: http
