apiVersion: v1
kind: ConfigMap
metadata:
  name: heroes
data:
  heroes.txt: |
    Superman
    Batman
    Wonder Woman
    Flash
---
apiVersion: v1
kind: Secret
metadata:
  name: db-creds
type: kubernetes.io/basic-auth
stringData:               # plain text here; the API server stores it base64-encoded
  username: admin
  password: s3cret
---
apiVersion: v1
kind: Pod
metadata:
  name: config-demo
spec:
  containers:
    - name: nginx
      image: nginx:1.27
      env:
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: db-creds
              key: username
      volumeMounts:
        - name: heroes-vol            # whole ConfigMap -> directory
          mountPath: /heroes
        - name: heroes-vol            # single key -> one file, siblings untouched
          mountPath: /etc/nginx/heroes.txt
          subPath: heroes.txt
        - name: creds-vol
          mountPath: /etc/creds
          readOnly: true
  volumes:
    - name: heroes-vol
      configMap:
        name: heroes
    - name: creds-vol
      secret:
        secretName: db-creds
