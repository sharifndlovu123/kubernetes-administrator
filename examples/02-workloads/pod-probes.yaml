# Pod with resource requests/limits and both probe types (set per container).
apiVersion: v1
kind: Pod
metadata:
  name: probe-demo
  labels:
    app: probe-demo
spec:
  containers:
    - name: web
      image: nginx:1.27
      ports:
        - containerPort: 80
      resources:
        requests:
          cpu: 250m
          memory: 64Mi
        limits:
          cpu: 500m
          memory: 128Mi
      livenessProbe:          # failure -> kubelet restarts the container
        httpGet:
          path: /
          port: 80
        initialDelaySeconds: 2
        periodSeconds: 5
        timeoutSeconds: 1
        failureThreshold: 3
      readinessProbe:         # failure -> pod removed from Service endpoints
        httpGet:
          path: /
          port: 80
        initialDelaySeconds: 2
        periodSeconds: 5
