# topologySpreadConstraints: spread matching Pods evenly across nodes.
# Source: https://kubernetes.io/docs/concepts/scheduling-eviction/topology-spread-constraints/
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spread-demo
spec:
  replicas: 4
  selector:
    matchLabels:
      app: spread-demo
  template:
    metadata:
      labels:
        app: spread-demo
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor   # default is Ignore: the tainted control-plane node would count as an empty domain
          labelSelector:
            matchLabels:
              app: spread-demo
      containers:
        - name: nginx
          image: nginx:1.27
