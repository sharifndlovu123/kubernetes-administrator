# Broken on purpose: neither ConfigMap exists.
#  - env-missing: key reference to a missing ConfigMap -> CreateContainerConfigError
#  - volume-missing: ConfigMap volume that is missing -> stuck in ContainerCreating (FailedMount event)
apiVersion: v1
kind: Pod
metadata:
  name: env-missing
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: [sleep, "3600"]
      env:
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef: {name: app-settings, key: log_level}
---
apiVersion: v1
kind: Pod
metadata:
  name: volume-missing
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: [sleep, "3600"]
      volumeMounts: [{name: cfg, mountPath: /etc/app}]
  volumes:
    - name: cfg
      configMap: {name: app-settings}
