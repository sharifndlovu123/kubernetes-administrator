apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  log_level: info
---
apiVersion: v1
kind: Pod
metadata:
  name: volume-types
spec:
  containers:
    - name: app
      image: busybox
      command: ["sleep", "3600"]
      volumeMounts:
        - {name: scratch, mountPath: /scratch}
        - {name: hostlogs, mountPath: /host-log, readOnly: true}
        - {name: merged, mountPath: /merged, readOnly: true}
  volumes:
    - name: scratch
      emptyDir:
        sizeLimit: 100Mi            # medium: Memory would back it with tmpfs
    - name: hostlogs
      # WARNING: hostPath exposes the node's filesystem (credentials, runtime socket) and differs per node; avoid outside demos (see notes/04-storage.md).
      hostPath:
        path: /var/log
        type: Directory
    - name: merged
      projected:
        sources:
          - configMap:
              name: app-config
          - downwardAPI:
              items:
                - path: labels
                  fieldRef:
                    fieldPath: metadata.labels
